<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RL training</title>
<!-- Dashboard of one train_ppo run. train_ppo copies this file into the run folder as index.html; it reads
     progress.jsonl, evals.jsonl and replays/ next to it every 5 s. Serve: README "Dashboard". -->
<style>
:root{--page:#f9f9f7;--surf:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--mute:#898781;--grid:#e1e0d9;--axis:#c3c2b7;
  --c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100;--c5:#e87ba4;--c6:#008300;--c7:#6250d6;--c8:#e34948;--good:#0ca30c;--crit:#d03b3b}
@media (prefers-color-scheme:dark){:root{--page:#0d0d0d;--surf:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--grid:#2c2c2a;--axis:#383835;
  --c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c7:#9085e9;--c8:#e66767}}
*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--page);color:var(--ink);font:13px/1.4 system-ui,sans-serif}
h1{font-size:16px;margin:0 0 2px}h2{font-size:13px;margin:20px 0 8px;color:var(--ink2);font-weight:600}
.sub{color:var(--mute);margin-bottom:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.tile,.card{background:var(--surf);border:1px solid var(--grid);border-radius:6px;padding:8px 10px}
.tile b{display:block;font-size:20px;font-weight:600}.tile span{color:var(--mute);font-size:11px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
.card h3{margin:0;font-size:12px;font-weight:600}.card p{margin:0 0 4px;color:var(--mute);font-size:11px}
.leg{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:11px;color:var(--ink2);min-height:16px}
.leg i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:4px;vertical-align:middle}
svg{display:block;width:100%;height:150px;overflow:visible}svg text{fill:var(--mute);font-size:10px}
#tip{position:fixed;pointer-events:none;background:var(--surf);border:1px solid var(--axis);border-radius:4px;padding:4px 8px;font-size:11px;display:none;z-index:9;white-space:nowrap}
.battle{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
canvas{background:var(--surf);border:1px solid var(--grid);border-radius:6px;max-width:100%}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}.ctl input[type=range]{flex:1;min-width:160px}
button,select{font:inherit;color:var(--ink);background:var(--surf);border:1px solid var(--axis);border-radius:4px;padding:3px 10px}
table{border-collapse:collapse;font-size:11px}td,th{padding:2px 8px;text-align:right;border-bottom:1px solid var(--grid)}th{color:var(--mute);font-weight:500}
.key{font-size:11px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:2px 10px;margin-top:6px;max-width:560px}
.key i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
</style></head><body>
<h1 id="title">RL training</h1><div class="sub" id="sub">waiting for progress.jsonl…</div>
<div class="tiles" id="tiles"></div>
<h2>Skill (does it play better?)</h2><div class="cards" id="skill"></div>
<h2>Behaviour (what does it do?)</h2><div class="cards" id="beh"></div>
<h2>Optimiser health</h2><div class="cards" id="opt"></div>
<h2>Battle replay <span style="font-weight:400;color:var(--mute)">— one battle per update; right: what the focus agent's policy saw</span></h2>
<div class="ctl"><select id="rsel" aria-label="replay"></select><button id="play">Pause</button>
 <select id="speed" aria-label="speed"><option value="1">1x</option><option value="3" selected>3x</option><option value="10">10x</option></select>
 <input type="range" id="scrub" min="0" max="0" value="0" aria-label="frame"><span id="finfo"></span></div>
<div class="battle"><canvas id="map" width="560" height="560"></canvas>
 <div><canvas id="view" width="325" height="325"></canvas><div class="key" id="key"></div><div id="act" style="margin-top:6px;color:var(--ink2)"></div></div></div>
<h2>Evals (player 0 = policy vs 9 native AI, held-out seeds)</h2><div class="card" style="overflow:auto"><table id="evt"></table></div>
<div id="tip"></div>
<script>
const $=id=>document.getElementById(id), css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const C=i=>css('--c'+(i+1)), fmt=v=>v==null?'–':Math.abs(v)>=1000?Math.round(v).toLocaleString():+(+v).toPrecision(3)+'';
const jl=async u=>{const r=await fetch(u+'?'+Date.now());if(!r.ok)return [];return (await r.text()).split('\n').filter(x=>x.trim()).map(x=>JSON.parse(x))};
let P=[],EV=[];

// one line chart: series [{name, pts:[[x,y]...], band?:[[x,lo,hi]]}], one y axis, crosshair + tooltip
function chart(host,id,title,note,series,o={}){
  let el=$(id);if(!el){el=document.createElement('div');el.className='card';el.id=id;
    el.innerHTML='<h3></h3><p></p><div class="leg"></div><svg></svg>';$(host).appendChild(el)}
  el.children[0].textContent=title;el.children[1].textContent=note;
  series=series.filter(s=>s.pts.length);
  el.children[2].innerHTML=series.length>1?series.map(s=>`<span><i style="background:${C(s.c)}"></i>${s.name}</span>`).join(''):'';
  const svg=el.children[3],W=svg.clientWidth||300,H=150,L=38,R=8,T=6,B=18;
  const all=series.flatMap(s=>s.pts.concat((s.band||[]).flatMap(b=>[[b[0],b[1]],[b[0],b[2]]])));
  if(!all.length){svg.innerHTML=`<text x="${W/2}" y="${H/2}" text-anchor="middle">no data yet</text>`;return}
  let x0=Math.min(...all.map(p=>p[0])),x1=Math.max(...all.map(p=>p[0])),y0=Math.min(...all.map(p=>p[1])),y1=Math.max(...all.map(p=>p[1]));
  if(o.ref!=null){y0=Math.min(y0,o.ref);y1=Math.max(y1,o.ref)}if(o.zero)y0=Math.min(0,y0);
  if(x1==x0)x1=x0+1;if(y1==y0){y1+=1;y0-=o.zero?0:1}const pad=(y1-y0)*.06;y1+=pad;if(!o.zero||y0<0)y0-=pad;
  const X=x=>L+(x-x0)/(x1-x0)*(W-L-R),Y=y=>T+(1-(y-y0)/(y1-y0))*(H-T-B);
  let h='';for(let i=0;i<=3;i++){const y=y0+(y1-y0)*i/3;h+=`<line x1="${L}" x2="${W-R}" y1="${Y(y)}" y2="${Y(y)}" stroke="var(--grid)"/><text x="${L-4}" y="${Y(y)+3}" text-anchor="end">${fmt(y)}</text>`}
  h+=`<text x="${L}" y="${H-4}">${fmt(x0)}</text><text x="${W-R}" y="${H-4}" text-anchor="end">update ${fmt(x1)}</text>`;
  if(o.split!=null&&o.split>x0&&o.split<x1)h+=`<line x1="${X(o.split)}" x2="${X(o.split)}" y1="${T}" y2="${H-B}" stroke="var(--axis)" stroke-dasharray="3 3"/><text x="${X(o.split)+3}" y="${T+8}">PPO starts</text>`;
  if(o.ref!=null)h+=`<line x1="${L}" x2="${W-R}" y1="${Y(o.ref)}" y2="${Y(o.ref)}" stroke="var(--good)" stroke-dasharray="4 3"/><text x="${W-R}" y="${Y(o.ref)-3}" text-anchor="end">${o.refLabel}</text>`;
  for(const s of series){
    if(s.band&&s.band.length>1)h+=`<path d="M${s.band.map(b=>X(b[0])+','+Y(b[2])).join('L')}L${s.band.slice().reverse().map(b=>X(b[0])+','+Y(b[1])).join('L')}Z" fill="${C(s.c)}" opacity=".15"/>`;
    h+=`<path d="M${s.pts.map(p=>X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join('L')}" fill="none" stroke="${C(s.c)}" stroke-width="2" stroke-linejoin="round"/>`;
    if(s.pts.length<40)h+=s.pts.map(p=>`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="${s.pts.length<2?4:2.5}" fill="${C(s.c)}"/>`).join('')}
  h+=`<line class="x" y1="${T}" y2="${H-B}" stroke="var(--axis)" visibility="hidden"/><rect x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="transparent"/>`;
  svg.innerHTML=h;const hair=svg.querySelector('.x'),tip=$('tip');
  svg.onmousemove=e=>{const bx=svg.getBoundingClientRect(),xv=x0+(e.clientX-bx.left-L)/(W-L-R)*(x1-x0);
    const xs=[...new Set(all.map(p=>p[0]))],xn=xs.reduce((a,b)=>Math.abs(b-xv)<Math.abs(a-xv)?b:a);
    hair.setAttribute('x1',X(xn));hair.setAttribute('x2',X(xn));hair.setAttribute('visibility','visible');
    tip.innerHTML=`<b>update ${xn}</b><br>`+series.map(s=>{const p=s.pts.find(p=>p[0]==xn);return p?`<i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${C(s.c)};margin-right:4px"></i>${s.name}: ${fmt(p[1])}`:''}).filter(x=>x).join('<br>');
    tip.style.display='block';tip.style.left=Math.min(e.clientX+12,innerWidth-170)+'px';tip.style.top=e.clientY+12+'px'};
  svg.onmouseleave=()=>{hair.setAttribute('visibility','hidden');tip.style.display='none'}}

// bar chart of one distribution (latest update), labels under selected bars
function bars(host,id,title,note,vals,labels){
  let el=$(id);if(!el){el=document.createElement('div');el.className='card';el.id=id;el.innerHTML='<h3></h3><p></p><div class="leg"></div><svg></svg>';$(host).appendChild(el)}
  el.children[0].textContent=title;el.children[1].textContent=note;const svg=el.children[3],W=svg.clientWidth||300,H=150,B=18,T=6;
  const sum=vals.reduce((a,b)=>a+b,0)||1,mx=Math.max(...vals,1),bw=(W-8)/vals.length;
  svg.innerHTML=vals.map((v,i)=>{const hh=v/mx*(H-T-B);return `<rect x="${4+i*bw+1}" y="${H-B-hh}" width="${Math.max(bw-2,1)}" height="${hh}" rx="2" fill="${C(0)}"><title>${labels[i]}: ${(100*v/sum).toFixed(1)} %</title></rect>`+
    (labels.length<=6||i%4==0?`<text x="${4+i*bw+bw/2}" y="${H-5}" text-anchor="middle">${labels[i]}</text>`:'')}).join('')+`<line x1="4" x2="${W-4}" y1="${H-B}" y2="${H-B}" stroke="var(--axis)"/>`}

const S=(k,name,c,rows=P)=>({name,c,pts:rows.filter(r=>r[k]!=null).map(r=>[r.update,r[k]])});
function draw(){
  if(!P.length)return;const l=P[P.length-1],e=EV[EV.length-1],sp=(P.find(r=>r.phase=='ppo')||{}).update;const o={split:sp};
  $('sub').textContent=`phase ${l.phase.toUpperCase()} · update ${l.update} · ${fmt(l.minutes)} min · refreshed ${new Date().toLocaleTimeString()}`;
  $('tiles').innerHTML=[[e?fmt(e.rank)+(e.ci95?' ±'+e.ci95:''):'–','eval rank (gate ≤ 3.0)'],[e?(100*e.win).toFixed(0)+' %':'–','eval win rate'],
    [fmt(l.rank),'training rank (last 400 ep)'],[(l.agent_steps/1e6).toFixed(2)+' M','decisions'],[fmt(l.decisions_per_s),'decisions / s'],
    [(100*l.hit_rate).toFixed(0)+' %','hit rate'],[fmt(l.episodes),'episodes'],[l.restarts,'instance restarts']].map(t=>`<div class="tile"><b>${t[0]}</b><span>${t[1]}</span></div>`).join('');
  const er=EV.filter(r=>r.rank!=null);
  chart('skill','c_eval','Eval mean rank','lower is better · band = 95 % CI',[{name:'eval rank',c:0,pts:er.map(r=>[r.update,r.rank]),band:er.filter(r=>r.ci95!=null).map(r=>[r.update,r.rank-r.ci95,r.rank+r.ci95])}],{ref:3,refLabel:'gate 3.0'});
  const ks=[...new Set(P.flatMap(r=>Object.keys(r).filter(k=>/^rank_k/.test(k))))].sort().slice(0,5);
  chart('skill','c_rank','Training mean rank','by agents per battle (k) · BC phase = the native AI itself',[S('rank','all',0),...ks.map((k,i)=>S(k,k.slice(5)+' agents',i+1))],o);
  chart('skill','c_win','Win and top-3 rate (eval)','share of eval battles',[{name:'win',c:0,pts:er.map(r=>[r.update,r.win])},{name:'top 3',c:1,pts:er.map(r=>[r.update,r.top3])}],{zero:1});
  chart('skill','c_ret','Episode return','sum of rewards per episode (training)',[S('ret','return',0)],o);
  chart('skill','c_dmg','Damage per episode','thousands of HP',[S('t_dealt','dealt',0),S('t_taken','taken',1)],{...o,zero:1});
  chart('skill','c_kills','Kills and cubes per episode','',[S('t_kills','kills',0),S('t_cubes','cubes',1)],{...o,zero:1});
  chart('beh','c_hit','Hit rate','hits / shots',[S('hit_rate','hit rate',0)],{...o,zero:1});
  chart('beh','c_surv','Survival','ticks alive per episode (20 ticks = 1 s)',[S('ticks','ticks',0)],{...o,zero:1});
  chart('beh','c_storm','Storm','share of deaths by storm · storm ticks per episode / 100',[S('storm_death','storm deaths',0),{name:'storm ticks / 100',c:1,pts:P.filter(r=>r.t_gas!=null).map(r=>[r.update,r.t_gas/100])}],{...o,zero:1});
  chart('beh','c_att','Attack fraction','share of decisions that fire an attack',[S('attack_frac','attack',0)],{...o,zero:1});
  bars('beh','c_move','Move directions (latest update)','stop, then 16 directions clockwise from right',l.move_hist,['stop','→','','','','↓','','','','←','','','','↑','','','']);
  bars('beh','c_fire','Fire choice (latest update)','',l.fire_hist,['none','attack','super']);
  bars('beh','c_aim','Aim angle when firing (latest update)','15° bins, 0° = right, clockwise',l.aim_hist,l.aim_hist.map((_,i)=>i*15+'°'));
  chart('opt','c_ent','Policy entropy','falling = more decided; a collapse to 0 is bad',[S('entropy','entropy',0)],o);
  chart('opt','c_loss','Policy loss','BC: cross-entropy to the native AI · PPO: clipped surrogate',[S('loss_pi','loss',0)],o);
  chart('opt','c_vl','Value loss','',[S('vloss','value loss',0)],{...o,zero:1});
  chart('opt','c_ev','Explained variance','1 = the critic predicts returns perfectly',[S('expl_var','explained variance',0)],o);
  chart('opt','c_kl','KL to the BC policy and clip fraction','PPO only',[S('kl_bc','KL(BC ‖ policy)',0),S('clipfrac','clip fraction',1)],{...o,zero:1});
  chart('opt','c_dps','Throughput','decisions per second while collecting',[S('decisions_per_s','decisions / s',0)],{...o,zero:1});
  const cols=['update','minutes','episodes','rank','ci95','win','top3','dealt','taken','kills','cubes','hit_rate','ticks'];
  $('evt').innerHTML='<tr>'+cols.map(c=>`<th>${c}</th>`).join('')+'</tr>'+EV.slice().reverse().map(r=>'<tr>'+cols.map(c=>`<td>${fmt(r[c])}</td>`).join('')+'</tr>').join('')}

// ---------------- battle replay
const TILE={floor:'#d9d3c3',indestructible:'#4b4a46',destructible_wall:'#7a6a55',fragile_wall:'#9a8468',bush:'#3f9a4c',faded_bush:'#8fc296',water:'#4d8fd0',
  rope_fence:'#b59a6a',bouncer:'#c05fb0',gravity:'#7d6fd0',slow_tile:'#a8a08a',fast_tile:'#e6dc9a',ice:'#bfe3ee',damage_tile:'#c9785a',power_box:'#c9a13a',
  poison:'#7a4fa0',out_of_bounds:'#22221f',destructible:'#8c7a60',unknown:'#00000000'};
const ECOL={enemy:'--c8',teammate:'--c3',enemy_summon:'--c5',teammate_summon:'--c6',power_box:'--c4',power_cube:'--c6',enemy_projectile:'--c2',teammate_projectile:'--c1',enemy_area_effect:'--c7',teammate_area_effect:'--c1'};
let RP=null,fi=0,playing=true,idx=[],follow=true;
async function loadIdx(){const r=await fetch('replays/index.json?'+Date.now());if(!r.ok)return;idx=await r.json();const sel=$('rsel'),cur=sel.value;
  sel.innerHTML=idx.slice().reverse().map(x=>`<option value="${x.file}">update ${x.update} · ${x.kind} · ${x.frames} steps</option>`).join('');
  if(follow||!cur){if(idx.length&&(!RP||RP.file!=idx[idx.length-1].file)&&(!RP||fi>=RP.frames.length-1))loadRp(idx[idx.length-1].file);else if(RP)sel.value=RP.file}else sel.value=cur}
async function loadRp(f){const r=await fetch('replays/'+f);if(!r.ok)return;RP=await r.json();RP.file=f;fi=0;$('rsel').value=f;$('scrub').max=RP.frames.length-1;
  const m=document.createElement('canvas');m.width=RP.W*8;m.height=RP.H*8;const g=m.getContext('2d');
  RP.map.forEach((row,y)=>[...row].forEach((ch,x)=>{g.fillStyle=TILE[RP.seg[ch.charCodeAt(0)-97]];g.fillRect(x*8,y*8,8,8)}));RP.img=m;
  $('key').innerHTML=[['--c1','focus agent'],['--c3','other agents'],['--c2','native AI']].map(k=>`<span><i style="background:${css(k[0])};border-radius:50%"></i>${k[1]}</span>`).join('')+
    Object.keys(ECOL).filter(k=>!/area|teammate/.test(k)).map(k=>`<span><i style="background:${css(ECOL[k])}"></i>seen: ${k.replace(/_/g,' ')}</span>`).join('')}
function frame(){if(!RP)return;const F=RP.frames[fi],cv=$('map'),g=cv.getContext('2d'),sc=cv.width/Math.max(RP.W,RP.H)/300,ink=css('--ink');
  g.clearRect(0,0,cv.width,cv.height);g.imageSmoothingEnabled=false;g.drawImage(RP.img,0,0,RP.W*300*sc,RP.H*300*sc);
  const me=F.p[F.f],cx=Math.min(Math.max(me[0],3000),RP.W*300-3000);
  g.strokeStyle=css('--c1');g.lineWidth=1.5;g.setLineDash([5,4]);g.strokeRect((cx-4500)*sc,(me[1]-3500)*sc,9000*sc,6400*sc);g.setLineDash([]);
  F.p.forEach((p,i)=>{if(!p[4])return;const x=p[0]*sc,y=p[1]*sc,ag=RP.ctl.includes(i)&&RP.kind!='bc';
    g.beginPath();g.arc(x,y,6,0,7);g.fillStyle=css(i==F.f?'--c1':ag?'--c3':'--c2');g.fill();g.lineWidth=2;g.strokeStyle=css('--surf');g.stroke();
    g.fillStyle='#0008';g.fillRect(x-9,y-13,18,3);g.fillStyle=css('--good');g.fillRect(x-9,y-13,18*p[2]/Math.max(p[3],1),3)});
  const x=me[0]*sc,y=me[1]*sc,a=F.a;g.lineWidth=2;
  if(a[0]>0){const t=(a[0]-1)*Math.PI/8;g.strokeStyle=ink;g.beginPath();g.moveTo(x,y);g.lineTo(x+16*Math.cos(t),y+16*Math.sin(t));g.stroke()}
  if(a[1]>0){const t=a[2]*Math.PI/180;g.strokeStyle=css(a[1]==2?'--c4':'--c8');g.beginPath();g.moveTo(x,y);g.lineTo(x+2700*sc*Math.cos(t),y+2700*sc*Math.sin(t));g.stroke()}
  // the policy's view: 25 x 25 seg grid + detected entities (noise and latency included)
  const v=$('view'),h=v.getContext('2d'),t=v.width/25;h.clearRect(0,0,v.width,v.height);
  for(let i=0;i<625;i++){const n=RP.seg[F.g.charCodeAt(i)-97];if(n=='unknown')continue;h.fillStyle=TILE[n];h.fillRect((i%25)*t,(i/25|0)*t,t,t)}
  const ox=(me[0]%300)/300*t,oy=(me[1]%300)/300*t,mx=12*t+ox,my=12*t+oy;
  for(const e of F.e){const n=RP.ent[e[0]],ex=mx+e[1]*10*t,ey=my+e[2]*10*t,r=/projectile/.test(n)?3:/box|cube/.test(n)?5:6;h.fillStyle=css(ECOL[n]);
    if(/box|cube|area/.test(n))h.fillRect(ex-r,ey-r,2*r,2*r);else{h.beginPath();h.arc(ex,ey,r,0,7);h.fill()}h.lineWidth=1.5;h.strokeStyle=css('--surf');h.strokeRect(ex-r,ey-r,2*r,2*r)}
  h.beginPath();h.arc(mx,my,6,0,7);h.fillStyle=css('--c1');h.fill();
  if(a[1]>0){const q=a[2]*Math.PI/180;h.strokeStyle=css(a[1]==2?'--c4':'--c8');h.lineWidth=2;h.beginPath();h.moveTo(mx,my);h.lineTo(mx+9*t*Math.cos(q),my+9*t*Math.sin(q));h.stroke()}
  const alive=F.p.filter(p=>p[4]).length;$('scrub').value=fi;$('finfo').textContent=`step ${fi+1}/${RP.frames.length} · tick ${F.t} · ${alive} alive`;
  $('act').innerHTML=`focus = player ${F.f} · HP ${(100*F.s[0]).toFixed(0)} % · ammo ${(3*F.s[1]).toFixed(1)} · super ${F.s[2]?'ready':'–'} · sees ${F.e.length} entities<br>action: move ${a[0]?(a[0]-1)*22.5+'°':'stop'} · ${['no fire','ATTACK at '+a[2]+'°','SUPER at '+a[2]+'°'][a[1]]}`}
$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'Pause':'Play'};
$('scrub').oninput=e=>{fi=+e.target.value;playing=false;$('play').textContent='Play';frame()};
$('rsel').onchange=e=>{follow=idx.length&&e.target.value==idx[idx.length-1].file;loadRp(e.target.value)};
setInterval(()=>{if(RP&&playing){fi=Math.min(fi+ +$('speed').value,RP.frames.length-1);frame()}},100);
async function tick(){try{P=await jl('progress.jsonl');EV=await jl('evals.jsonl');draw();await loadIdx()}catch(e){$('sub').textContent='load error: '+e}}
if(/^http/.test(location.protocol))$('title').textContent='RL training · '+(location.pathname.split('/').filter(x=>x&&!/\.html$/.test(x)).pop()||'run');
else $('sub').textContent='Opened as a file: no run data here. Open http://localhost:8765/<run>/ instead (README "Dashboard").';
if(/^http/.test(location.protocol))tick();setInterval(tick,5000);addEventListener('resize',draw);
</script></body></html>
